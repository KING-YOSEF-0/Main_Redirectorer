<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Casio fx-991ES PLUS Replica</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.0/math.min.js"></script>
</head>
<body>
    <div class="calculator">
        <div class="screen-area">
            <div class="brand">CASIO</div>
            <div class="model">fx-991ES PLUS</div>
            <div class="display" id="display">0</div>
        </div>
        <div class="button-grid">
            <button class="btn shift">SHIFT</button>
            <button class="btn alpha">ALPHA</button>
            <button class="btn replay">REPLAY</button>

            <button class="btn func">CALC</button>
            <button class="btn func">∫dx</button>
            <button class="btn func">x²</button>
            <button class="btn func">log</button>
            <button class="btn func">ln</button>

            <button class="btn num">7</button>
            <button class="btn num">8</button>
            <button class="btn num">9</button>
            <button class="btn op">DEL</button>
            <button class="btn op-orange">AC</button>

            <button class="btn num">4</button>
            <button class="btn num">5</button>
            <button class="btn num">6</button>
            <button class="btn op">×</button>
            <button class="btn op">÷</button>

            <button class="btn num">1</button>
            <button class="btn num">2</button>
            <button class="btn num">3</button>
            <button class="btn op">+</button>
            <button class="btn op">-</button>

            <button class="btn num">0</button>
            <button class="btn num">.</button>
            <button class="btn num">EXP</button>
            <button class="btn num">Ans</button>
            <button class="btn op-equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
