<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio fx-991ES PLUS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div id="top-row"></div>
            <div id="main-row">0</div>
        </div>
        <div class="buttons">
            <!-- Simplified layout to fit the screen -->
            <button class="btn fn">SHIFT</button><button class="btn fn">ALPHA</button>
            <button class="btn">7</button><button class="btn">8</button><button class="btn">9</button><button class="btn del">DEL</button><button class="btn ac">AC</button>
            <button class="btn">4</button><button class="btn">5</button><button class="btn">6</button><button class="btn">*</button><button class="btn">/</button>
            <button class="btn">1</button><button class="btn">2</button><button class="btn">3</button><button class="btn">+</button><button class="btn">-</button>
            <button class="btn">0</button><button class="btn">.</button><button class="btn equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
