<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Casio fx-991ES PLUS Replica</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.0/math.min.js"></script>
</head>
<body>
    <div class="calculator">
        <div class="grip"></div>
        <div class="body">
            <div class="top">
                <div class="brand">CASIO</div>
                <div class="solar-panel"></div>
                <div class="twopower">TWO WAY POWER</div>
            </div>
            <div class="screen-area">
                <div class="model">fx-991ES PLUS</div>
                <div class="vpam">NATURAL-V.P.A.M.</div>
                <div class="display" id="display">0</div>
            </div>
            <div class="button-container">
                <div class="row">
                    <button class="btn nav">SHIFT</button>
                    <button class="btn nav">ALPHA</button>
                    <div class="replay-pad">
                        <div class="replay-center">REPLAY</div>
                    </div>
                    <button class="btn nav">MODE</button>
                    <button class="btn on">ON</button>
                </div>
                <div class="row">
                    <button class="btn sci">CALC</button>
                    <button class="btn sci">∫dx</button>
                    <button class="btn sci">x⁻¹</button>
                    <button class="btn sci">log</button>
                </div>
                <div class="row">
                    <button class="btn sci">x³</button>
                    <button class="btn sci">√</button>
                    <button class="btn sci">x²</button>
                    <button class="btn sci">x^</button>
                    <button class="btn sci">log</button>
                    <button class="btn sci">ln</button>
                </div>
                <div class="row">
                    <button class="btn sci">(-)</button>
                    <button class="btn sci">hyp</button>
                    <button class="btn sci">sin</button>
                    <button class="btn sci">cos</button>
                    <button class="btn sci">tan</button>
                </div>
                <div class="row">
                    <button class="btn sci">RCL</button>
                    <button class="btn sci">ENG</button>
                    <button class="btn sci">(</button>
                    <button class="btn sci">)</button>
                    <button class="btn sci">S⇔D</button>
                    <button class="btn sci">M+</button>
                </div>
                <div class="row">
                    <button class="btn num">7</button>
                    <button class="btn num">8</button>
                    <button class="btn num">9</button>
                    <button class="btn op-orange">DEL</button>
                    <button class="btn op-orange">AC</button>
                </div>
                <div class="row">
                    <button class="btn num">4</button>
                    <button class="btn num">5</button>
                    <button class="btn num">6</button>
                    <button class="btn op">×</button>
                    <button class="btn op">÷</button>
                </div>
                <div class="row">
                    <button class="btn num">1</button>
                    <button class="btn num">2</button>
                    <button class="btn num">3</button>
                    <button class="btn op">+</button>
                    <button class="btn op">-</button>
                </div>
                <div class="row">
                    <button class="btn num">0</button>
                    <button class="btn num">.</button>
                    <button class="btn num">x10ˣ</button>
                    <button class="btn num">Ans</button>
                    <button class="btn op-equals">=</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js?v=2"></script>
</body>
</html>
