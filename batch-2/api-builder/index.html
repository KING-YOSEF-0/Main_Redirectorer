<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request Builder</title>
</head>
<body>
    <div class="api-builder-container">
        <h1>API Request Builder</h1>

        <form id="api-request-form">
            <div class="form-group">
                <label for="method">HTTP Method</label>
                <select id="method" name="method" required>
                    <option value="">Select Method</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                </select>
            </div>

            <div class="form-group">
                <label for="endpoint">Endpoint URL</label>
                <input type="url" id="endpoint" name="endpoint" placeholder="https://api.example.com/resource" required>
            </div>

            <div class="form-group">
                <label for="headers">Headers</label>
                <textarea id="headers" name="headers" placeholder='{"Content-Type": "application/json", "Authorization": "Bearer TOKEN"}'></textarea>
            </div>

            <div class="form-group">
                <label for="body">Request Body</label>
                <textarea id="body" name="body" placeholder='{
    "key": "value",
    "nested": {
        "property": "data"
    }
}'></textarea>
            </div>

            <div class="form-group">
                <button type="submit">Build Request</button>
            </div>
        </form>

        <div id="request-preview" class="hidden">
            <h2>Request Preview</h2>
            <div id="request-details"></div>
        </div>
    </div>
</body>
</html>
