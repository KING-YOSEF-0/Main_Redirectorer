<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regex Tester & Debugger | KING_YOSEF_</link>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="app-title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
          <path d="M15 5l4 4"/>
        </svg>
        <span>RegexTester</span>
        <span class="version">v2.0</span>
      </div>
      <div class="toolbar-divider"></div>
      <nav class="toolbar-tabs" role="tablist">
        <button role="tab" class="tab active" data-tab="tester" aria-selected="true">Tester</button>
        <button role="tab" class="tab" data-tab="library" aria-selected="false">Patterns</button>
        <button role="tab" class="tab" data-tab="saved" aria-selected="false">Saved</button>
        <button role="tab" class="tab" data-tab="explain" aria-selected="false">Explain</button>
        <button role="tab" class="tab" data-tab="code" aria-selected="false">Code</button>
        <button role="tab" class="tab" data-tab="perf" aria-selected="false">Perf</button>
      </nav>
    </div>
    <div class="toolbar-right">
      <button class="icon-btn" id="btn-share" title="Share via URL (Ctrl+Shift+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="19" r="3"/>
          <path d="M8.59 13.51 15.49 6.51"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-export" title="Export Matches (Ctrl+E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <a href="https://king-yosef-0.github.io/Protfolio/" target="_blank" class="icon-btn" title="About Me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4"/>
          <path d="M12 8h.01"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="workspace">
    <!-- Tester Tab -->
    <section class="tab-panel active" id="tab-tester" role="tabpanel">
      <div class="editor-split">
        <!-- Left Panel: Pattern & Input -->
        <div class="editor-pane">
          <div class="pane-header">
            <h2 class="pane-title">Pattern & Input</h2>
            <div class="pane-actions">
              <button class="icon-btn small" id="btn-clear" title="Clear All (Ctrl+Shift+C)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="editor-section">
            <label class="editor-label" for="regex-pattern">Regular Expression</label>
            <div class="editor-input-wrapper">
              <span class="editor-prefix">/</span>
              <input type="text" id="regex-pattern" class="editor-input" placeholder="pattern" spellcheck="false" aria-label="Regex pattern">
              <span class="editor-suffix">/</span>
              <input type="text" id="regex-flags-input" class="editor-flags-input" placeholder="gimsuyd" aria-label="Regex flags" maxlength="7">
            </div>
            <div class="editor-hint">Use /pattern/flags format or type pattern and flags separately. Flags: g (global), i (ignore case), m (multiline), s (dotAll), u (unicode), y (sticky), d (indices)</div>
          </div>

          <div class="editor-section">
            <div class="section-row">
              <label class="editor-label" for="test-strings">Test Strings <span class="badge" id="string-count">1</span></label>
              <button class="icon-btn small" id="btn-add-string" title="Add Test String (Alt+N)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
            </div>
            <div class="test-strings-container" id="test-strings-container">
              <div class="test-string-item active" data-index="0">
                <textarea id="test-string-0" class="editor-textarea" placeholder="Enter test string..." aria-label="Test string 1"></textarea>
                <div class="string-actions">
                  <span class="string-index">1</span>
                  <button class="icon-btn tiny remove-string" title="Remove" data-index="0">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="editor-section">
            <label class="editor-label">Flags</label>
            <div class="flags-grid" id="flags-grid">
              <label class="flag-toggle"><input type="checkbox" id="flag-g" checked><span>g</span><span class="flag-desc">Global</span></label>
              <label class="flag-toggle"><input type="checkbox" id="flag-i"><span>i</span><span class="flag-desc">Ignore Case</span></label>
              <label class="flag-toggle"><input type="checkbox" id="flag-m"><span>m</span><span class="flag-desc">Multiline</span></label>
              <label class="flag-toggle"><input type="checkbox" id="flag-s"><span>s</span><span class="flag-desc">DotAll</span></label>
              <label class="flag-toggle"><input type="checkbox" id="flag-u" checked><span>u</span><span class="flag-desc">Unicode</span></label>
              <label class="flag-toggle"><input type="checkbox" id="flag-y"><span>y</span><span class="flag-desc">Sticky</span></label>
              <label class="flag-toggle"><input type="checkbox" id="flag-d"><span>d</span><span class="flag-desc">Indices</span></label>
            </div>
          </div>

          <div class="editor-section substitution-section">
            <div class="section-row">
              <label class="editor-label">Substitution</label>
              <label class="toggle-switch"><input type="checkbox" id="sub-enabled"><span class="toggle-slider"></span></label>
            </div>
            <div class="substitution-fields" id="substitution-fields" hidden>
              <div class="editor-field">
                <label class="editor-label" for="replacement">Replacement</label>
                <input type="text" id="replacement" class="editor-input" placeholder="$1-$2 or {{name}} or $$ for literal $" aria-label="Replacement string">
                <div class="editor-hint">Use $1, $2... for groups, $& for full match, $` for before, $' for after, {{name}} for named groups</div>
              </div>
              <label class="checkbox-inline"><input type="checkbox" id="replace-all"><span>Replace All (global)</span></label>
              <div class="editor-field">
                <label class="editor-label">Result</label>
                <textarea id="replacement-result" class="editor-textarea readonly" readonly aria-label="Substitution result"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Resizer -->
        <div class="split-resizer" id="split-resizer" role="separator" aria-label="Resize panels" tabindex="0"></div>

        <!-- Right Panel: Results -->
        <div class="editor-pane results-pane">
          <div class="pane-header">
            <h2 class="pane-title">Matches <span class="match-count" id="match-count">0</span></h2>
            <div class="pane-actions">
              <button class="icon-btn small" id="btn-copy-matches" title="Copy Matches (Ctrl+Shift+M)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
              <button class="icon-btn small" id="btn-copy-groups" title="Copy Groups (Ctrl+Shift+G)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="results-content" id="results-content">
            <div class="empty-state" id="empty-state">
              <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M13.5 6.5 12 8l-2.5 1.5"/>
                <path d="M10.88 6.88a6.5 6.5 0 0 1 9.24 9.24"/>
                <path d="M16.12 17.12a10 10 0 0 1-9.24-9.24"/>
              </svg>
              <p>Enter a pattern and test string to see matches</p>
              <kbd class="hint-kbd">Ctrl+Enter</kbd> <span class="hint-text">to test</span>
            </div>

            <div class="highlighted-container" id="highlighted-container" hidden>
              <pre class="highlighted-text" id="highlighted-text"></pre>
            </div>

            <div class="matches-list" id="matches-list" hidden></div>
          </div>

          <!-- Match Detail Panel -->
          <div class="detail-panel" id="detail-panel" hidden>
            <div class="detail-header">
              <h3 class="detail-title">Match Details</h3>
              <button class="icon-btn small" id="btn-close-detail">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            <div class="detail-content" id="detail-content"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Patterns Library Tab -->
    <section class="tab-panel" id="tab-library" role="tabpanel" hidden>
      <div class="library-header">
        <h2 class="pane-title">Common Patterns Library</h2>
        <div class="library-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="library-search" placeholder="Search patterns..." aria-label="Search patterns">
        </div>
      </div>
      <div class="patterns-grid" id="patterns-grid"></div>
    </section>

    <!-- Saved Patterns Tab -->
    <section class="tab-panel" id="tab-saved" role="tabpanel" hidden>
      <div class="pane-header">
        <h2 class="pane-title">Saved Patterns</h2>
      </div>
      <div class="saved-list" id="saved-list">
        <div class="empty-state" id="saved-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <p>No saved patterns yet</p>
          <span class="hint-text">Save patterns from the Tester tab</span>
        </div>
      </div>
    </section>

    <!-- Explain Tab -->
    <section class="tab-panel" id="tab-explain" role="tabpanel" hidden>
      <div class="pane-header">
        <h2 class="pane-title">Pattern Explanation</h2>
      </div>
      <div class="explain-content" id="explain-content">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <p>Enter a pattern in the Tester tab to see token-by-token explanation</p>
        </div>
      </div>
    </section>

    <!-- Code Generator Tab -->
    <section class="tab-panel" id="tab-code" role="tabpanel" hidden>
      <div class="pane-header">
        <h2 class="pane-title">Code Generator</h2>
        <div class="pane-actions">
          <button class="icon-btn small" id="btn-copy-code" title="Copy Code (Ctrl+Shift+K)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="code-workspace">
        <div class="code-lang-bar" id="code-lang-bar"></div>
        <div class="code-output" id="code-output">
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M16 18l6-6-6-6"/>
              <path d="M8 6l-6 6 6 6"/>
            </svg>
            <p>Enter a regex pattern to generate code snippets</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Performance Tab -->
    <section class="tab-panel" id="tab-perf" role="tabpanel" hidden>
      <div class="pane-header">
        <h2 class="pane-title">Performance Benchmark</h2>
        <div class="pane-actions">
          <button class="icon-btn small" id="btn-run-perf" title="Run Benchmark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="perf-content" id="perf-content">
        <div class="perf-config">
          <div class="editor-field">
            <label class="editor-label" for="perf-input-size">Test Input Size</label>
            <input type="number" id="perf-input-size" class="editor-input" value="1000" min="100" max="100000" step="100">
          </div>
          <div class="editor-field">
            <label class="editor-label" for="perf-iterations">Iterations</label>
            <input type="number" id="perf-iterations" class="editor-input" value="100" min="10" max="1000" step="10">
          </div>
          <div class="editor-field">
            <label class="editor-label" for="perf-timeout">Timeout (ms)</label>
            <input type="number" id="perf-timeout" class="editor-input" value="500" min="100" max="5000" step="100">
          </div>
        </div>
        <div class="perf-results" id="perf-results">
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 3v18h18"/>
              <path d="M7 14l3-4 3 3 4-6"/>
            </svg>
            <p>Press <kbd>Run Benchmark</kbd> to test regex performance</p>
          </div>
        </div>
        <div class="perf-warning" id="perf-warning" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.73 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span id="perf-warning-text"></span>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>Made with 💖 by <strong>KING_YOSEF_</strong></span>
    <a href="https://king-yosef-0.github.io/Protfolio/" target="_blank" class="about-link">About Me</a>
  </footer>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- Share Modal -->
<div class="modal" id="share-modal" role="dialog" aria-modal="true" aria-labelledby="share-title" hidden>
  <div class="modal-content">
    <button class="modal-close" id="share-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 id="share-title">Share Regex</h3>
    <p class="modal-desc">Copy this link to share your regex with others</p>
    <div class="share-url-wrapper">
      <input type="text" id="share-url" readonly aria-label="Share URL">
      <button class="btn primary" id="btn-copy-share">Copy Link</button>
    </div>
    <div class="share-options">
      <label class="checkbox-inline"><input type="checkbox" id="share-include-strings" checked><span>Include test strings</span></label>
      <label class="checkbox-inline"><input type="checkbox" id="share-include-replacement"><span>Include substitution</span></label>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
