<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaced Repetition Study Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flashcard Study Platform</h1>
    <div class="flashcard-container">
        <div class="flashcard">
            <div class="flashcard-front">Front of card</div>
            <div class="flashcard-back" style="display:none;">Back of card</div>
        </div>
    </div>
    <button onclick="flipCard()">Flip Card</button>
    <button onclick="nextCard()">Next Card</button>
    <script src="script.js"></script>
</body>
</html>
