<!DOCTYPE html>
<html>
<head><title>API Tester</title></head>
<body>
<h1>API Endpoint Tester</h1>
<div id="app">
    <div class="tasks">
        <p>1. Select Method: <select><option>GET</option><option>POST</option></select></p>
        <p>2. URL: <input type="text"></p>
        <p>3. Add Header <button>+</button></p>
        <p>4. Request Body: <textarea></textarea></p>
        <p>5. <button>Send Request</button></p>
        <p>6. Response Status: <span id="status">-</span></p>
        <p>7. View Headers: <pre id="headers"></pre></p>
        <p>8. Response Body: <pre id="body"></pre></p>
        <p>9. Timing: <span id="time">0ms</span></p>
        <p>10. <button>Copy Response</button></p>
    </div>
</div>
</body>
</html>
