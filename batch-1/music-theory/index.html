<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Theory Pro: Master the Keys</title>
    <style>
        :root {
            --bg-color: #0c0a09;
            --card-bg: #1c1917;
            --accent: #eab308;
            --text: #fafaf9;
        }
        body { font-family: 'Georgia', serif; background: var(--bg-color); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 900px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #444; }
        h1 { font-style: italic; color: var(--accent); margin-bottom: 30px; text-align: center; font-size: 2.5em; }
        .piano { display: flex; justify-content: center; margin-bottom: 30px; background: #000; padding: 10px; border-radius: 10px; overflow-x: auto; }
        .key { width: 40px; height: 180px; background: white; border: 1px solid #ccc; border-radius: 0 0 5px 5px; cursor: pointer; position: relative; transition: background 0.1s; }
        .key.black { width: 30px; height: 110px; background: #222; margin-left: -15px; margin-right: -15px; z-index: 2; border: none; }
        .key:active, .key.active { background: var(--accent) !important; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { background: #292524; padding: 20px; border-radius: 12px; border: 1px solid #444; }
        select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; }
        button { background: var(--accent); color: #000; cursor: pointer; }
        .note-display { font-size: 3em; text-align: center; margin: 20px 0; color: var(--accent); font-weight: bold; }
        .score { text-align: center; font-family: monospace; color: #a8a29e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Music Theory Pro</h1>

        <div class="piano" id="piano">
            <!-- Keys will be generated by JS -->
        </div>

        <div class="controls">
            <div class="panel">
                <h3>Scale Generator</h3>
                <select id="root-note">
                    <option value="C">C</option><option value="C#">C#</option><option value="D">D</option>
                    <option value="D#">D#</option><option value="E">E</option><option value="F">F</option>
                    <option value="F#">F#</option><option value="G">G</option><option value="G#">G#</option>
                    <option value="A">A</option><option value="A#">A#</option><option value="B">B</option>
                </select>
                <select id="scale-type">
                    <option value="major">Major Scale</option>
                    <option value="minor">Natural Minor</option>
                    <option value="pentatonic">Major Pentatonic</option>
                </select>
                <button onclick="playScale()">Play Scale</button>
            </div>
            <div class="panel">
                <h3>Ear Training Quiz</h3>
                <div class="note-display" id="quiz-note">?</div>
                <button onclick="startQuiz()" style="background: #444; color: white;">New Note</button>
                <p id="quiz-feedback" style="text-align:center; margin-top:10px;"></p>
            </div>
        </div>
        <div class="score" id="score">Score: 0 | Best: 0</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const frequencies = {
            "C": 261.63, "C#": 277.18, "D": 293.66, "D#": 311.13, "E": 329.63, "F": 349.23,
            "F#": 369.99, "G": 392.00, "G#": 415.30, "A": 440.00, "A#": 466.16, "B": 493.88
        };

        const piano = document.getElementById('piano');
        notes.forEach(note => {
            const key = document.createElement('div');
            key.className = `key ${note.includes('#') ? 'black' : ''}`;
            key.dataset.note = note;
            key.onclick = () => { playNote(note); checkQuiz(note); };
            piano.appendChild(key);
        });

        function playNote(note, duration = 0.5) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(frequencies[note], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        async function playScale() {
            const root = document.getElementById('root-note').value;
            const type = document.getElementById('scale-type').value;
            const intervals = type === 'major' ? [0, 2, 4, 5, 7, 9, 11, 12] :
                             type === 'minor' ? [0, 2, 3, 5, 7, 8, 10, 12] : [0, 2, 4, 7, 9, 12];

            const rootIdx = notes.indexOf(root);
            for (let i of intervals) {
                const note = notes[(rootIdx + i) % 12];
                playNote(note, 0.4);
                await new Promise(r => setTimeout(r, 400));
            }
        }

        let currentQuizNote = null;
        let score = 0;
        let best = localStorage.getItem('music_best') || 0;

        function startQuiz() {
            currentQuizNote = notes[Math.floor(Math.random() * notes.length)];
            document.getElementById('quiz-note').textContent = "?";
            document.getElementById('quiz-feedback').textContent = "Listen and identify the note...";
            playNote(currentQuizNote, 1);
        }

        function checkQuiz(note) {
            if (!currentQuizNote) return;
            const feedback = document.getElementById('quiz-feedback');
            if (note === currentQuizNote) {
                score++;
                if (score > best) {
                    best = score;
                    localStorage.setItem('music_best', best);
                }
                feedback.textContent = "Correct! It was " + note + " ✨";
                feedback.style.color = "#10b981";
                document.getElementById('quiz-note').textContent = note;
                currentQuizNote = null;
            } else {
                score = 0;
                feedback.textContent = "Wrong! Try listening again.";
                feedback.style.color = "#ef4444";
                playNote(currentQuizNote, 1);
            }
            document.getElementById('score').textContent = `Score: ${score} | Best: ${best}`;
        }
    </script>
</body>
</html>
