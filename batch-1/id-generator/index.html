<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Snippet Manager Pro</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #238636;
            --text: #c9d1d9;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid #30363d; }
        h1 { color: #58a6ff; margin-top: 0; }
        input, select, textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; margin-top: 5px; box-sizing: border-box; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .snippet-card { background: #21262d; border: 1px solid #30363d; padding: 15px; border-radius: 6px; margin-top: 15px; position: relative; }
        pre { background: #0d1117; padding: 10px; border-radius: 6px; overflow-x: auto; color: #a5d6ff; }
        .tag { display: inline-block; background: #1f6feb; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Code Snippet Manager Pro</h1>
        <div>
            <label>Title</label>
            <input type="text" id="title" placeholder="e.g., Fetch API Wrapper">
            <label>Language</label>
            <select id="lang">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="html">HTML/CSS</option>
                <option value="sql">SQL</option>
            </select>
            <label>Snippet Code</label>
            <textarea id="code" rows="5" placeholder="console.log('Hello World');"></textarea>
            <button onclick="saveSnippet()">Save Snippet</button>
        </div>
        <hr style="border-color: #30363d; margin: 25px 0;">
        <h2>Saved Snippets</h2>
        <div id="list"></div>
    </div>
    <script>
        let snippets = JSON.parse(localStorage.getItem('snippets') || '[]');

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = snippets.length === 0 ? '<p>No snippets saved yet.</p>' : '';
            snippets.forEach((s, idx) => {
                list.innerHTML += `
                    <div class="snippet-card">
                        <h3>${s.title} <span class="tag">${s.lang}</span></h3>
                        <pre><code>${escapeHtml(s.code)}</code></pre>
                        <button style="background: #da3633; padding: 5px 10px;" onclick="deleteSnippet(${idx})">Delete</button>
                    </div>
                `;
            });
        }

        function saveSnippet() {
            const title = document.getElementById('title').value;
            const lang = document.getElementById('lang').value;
            const code = document.getElementById('code').value;
            if(!title || !code) return alert('Please fill in title and code');
            snippets.push({ title, lang, code });
            localStorage.setItem('snippets', JSON.stringify(snippets));
            document.getElementById('title').value = '';
            document.getElementById('code').value = '';
            render();
        }

        function deleteSnippet(idx) {
            snippets.splice(idx, 1);
            localStorage.setItem('snippets', JSON.stringify(snippets));
            render();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        render();
    </script>
</body>
</html>
