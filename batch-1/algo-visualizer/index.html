<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer Pro</title>
    <style>
        :root {
            --bg-color: #0a0e1a;
            --card-bg: #111827;
            --accent: #22d3ee;
            --text: #e5e7eb;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
        h1 { color: var(--accent); margin-top: 0; }
        input, select, textarea { width: 100%; padding: 10px; background: #0a0e1a; border: 1px solid #1f2937; color: white; border-radius: 6px; margin-top: 5px; box-sizing: border-box; }
        button { background: var(--accent); color: #0a0e1a; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bars { display: flex; align-items: flex-end; justify-content: center; height: 200px; gap: 4px; background: #0a0e1a; padding: 15px; border-radius: 8px; border: 1px solid #1f2937; }
        .bar { background: var(--accent); width: 20px; border-radius: 3px 3px 0 0; transition: height 0.1s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Algorithm Visualizer Pro</h1>
        <div class="grid">
            <div>
                <label>Algorithm</label>
                <select id="algo">
                    <option value="bubble">Bubble Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                </select>
                <label>Array Size</label>
                <input type="number" id="size" value="20" min="5" max="50">
                <label>Speed</label>
                <input type="range" id="speed" min="1" max="100" value="50">
                <button onclick="generate()">Generate Array</button>
                <button onclick="sort()">Sort</button>
            </div>
            <div>
                <label>Array Values</label>
                <input type="text" id="values" placeholder="e.g., 5, 3, 8, 1, 9">
                <div class="bars" id="bars"></div>
            </div>
        </div>
    </div>
    <script>
        let arr = [];
        let speed = 50;

        function generate() {
            const size = parseInt(document.getElementById('size').value) || 20;
            arr = [];
            for (let i = 0; i < size; i++) arr.push(Math.floor(Math.random() * 100) + 1);
            document.getElementById('values').value = arr.join(', ');
            render();
        }

        function render() {
            const bars = document.getElementById('bars');
            bars.innerHTML = '';
            const max = Math.max(...arr, 1);
            arr.forEach(v => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (v / max * 180) + 'px';
                bars.appendChild(bar);
            });
        }

        async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function sort() {
            const algo = document.getElementById('algo').value;
            speed = parseInt(document.getElementById('speed').value);
            const delay = 101 - speed;

            if (algo === 'bubble') {
                for (let i = 0; i < arr.length; i++) {
                    for (let j = 0; j < arr.length - i - 1; j++) {
                        if (arr[j] > arr[j + 1]) {
                            [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
                            render();
                            await sleep(delay);
                        }
                    }
                }
            } else if (algo === 'merge') {
                async function merge(l, m, r) {
                    const L = arr.slice(l, m), R = arr.slice(m, r);
                    let i = 0, j = 0, k = l;
                    while (i < L.length && j < R.length) {
                        arr[k++] = L[i] < R[j] ? L[i++] : R[j++];
                        render();
                        await sleep(delay);
                    }
                    while (i < L.length) arr[k++] = L[i++];
                    while (j < R.length) arr[k++] = R[j++];
                }
                async function ms(l, r) {
                    if (r - l <= 1) return;
                    const m = Math.floor((l + r) / 2);
                    await ms(l, m);
                    await ms(m, r);
                    await merge(l, m, r);
                }
                await ms(0, arr.length);
            } else if (algo === 'quick') {
                async function qs(l, r) {
                    if (l >= r) return;
                    const pivot = arr[r];
                    let i = l;
                    for (let j = l; j < r; j++) {
                        if (arr[j] < pivot) {
                            [arr[i], arr[j]] = [arr[j], arr[i]];
                            i++;
                            render();
                            await sleep(delay);
                        }
                    }
                    [arr[i], arr[r]] = [arr[r], arr[i]];
                    render();
                    await sleep(delay);
                    await qs(l, i - 1);
                    await qs(i + 1, r);
                }
                await qs(0, arr.length - 1);
            }
        }

        generate();
    </script>
</body>
</html>
