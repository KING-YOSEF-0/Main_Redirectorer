<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Solver & Generator Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --text: #f1f5f9;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 900px; width: 100%; background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        h1 { color: var(--accent); margin-top: 0; text-align: center; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; background: #334155; padding: 15px; border-radius: 12px; }
        canvas { background: #0f172a; border: 4px solid #475569; border-radius: 8px; display: block; margin: 0 auto; max-width: 100%; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { filter: brightness(1.1); }
        .stats { text-align: center; margin-top: 10px; font-family: monospace; color: #94a3b8; }
        label { font-size: 0.9em; color: #94a3b8; }
        select, input { background: #1e293b; color: white; border: 1px solid #475569; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Maze Solver & Generator Pro</h1>
        <div class="controls">
            <div>
                <label>Grid Size</label><br>
                <input type="number" id="size" value="21" min="5" max="51" step="2" style="width: 60px;">
            </div>
            <div>
                <label>Algorithm</label><br>
                <select id="algo">
                    <option value="dfs">Recursive DFS</option>
                    <option value="prim">Prim's Random</option>
                </select>
            </div>
            <button onclick="generateMaze()">New Maze</button>
            <button onclick="solveMaze()" style="background: #3b82f6; color: white;">Solve (BFS)</button>
            <button onclick="clearPath()" style="background: #64748b; color: white;">Clear Path</button>
        </div>
        <canvas id="mazeCanvas"></canvas>
        <div class="stats" id="stats">Ready to generate. Use odd numbers for best results.</div>
    </div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        let grid = [];
        let size = 21;
        let cellSize = 20;

        function initGrid() {
            size = parseInt(document.getElementById('size').value);
            if (size % 2 === 0) size++; // Must be odd
            cellSize = Math.floor(600 / size);
            canvas.width = size * cellSize;
            canvas.height = size * cellSize;
            grid = Array(size).fill().map(() => Array(size).fill(1)); // 1 is wall, 0 is path
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (grid[y][x] === 1) ctx.fillStyle = '#1e293b';
                    else if (grid[y][x] === 2) ctx.fillStyle = '#3b82f6'; // Path
                    else if (grid[y][x] === 3) ctx.fillStyle = '#10b981'; // Solution
                    else ctx.fillStyle = '#0f172a';
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
            // Start/End markers
            ctx.fillStyle = '#ef4444'; ctx.fillRect(cellSize, cellSize, cellSize, cellSize);
            ctx.fillStyle = '#f59e0b'; ctx.fillRect((size-2)*cellSize, (size-2)*cellSize, cellSize, cellSize);
        }

        function generateMaze() {
            initGrid();
            const algo = document.getElementById('algo').value;
            if (algo === 'dfs') recursiveDFS(1, 1);
            else randomizedPrims();
            draw();
            document.getElementById('stats').textContent = `Generated ${size}x${size} maze. Start: Top-Left, End: Bottom-Right.`;
        }

        function recursiveDFS(x, y) {
            grid[y][x] = 0;
            const dirs = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = x + dx, ny = y + dy;
                if (nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && grid[ny][nx] === 1) {
                    grid[y + dy/2][x + dx/2] = 0;
                    recursiveDFS(nx, ny);
                }
            }
        }

        function randomizedPrims() {
            // Simplified Prim's
            let walls = [];
            grid[1][1] = 0;
            walls.push([1, 2, 1, 1], [2, 1, 1, 1]); // x, y, parentX, parentY
            while (walls.length > 0) {
                let idx = Math.floor(Math.random() * walls.length);
                let [x, y, px, py] = walls.splice(idx, 1)[0];
                if (grid[y][x] === 1) {
                    grid[y][x] = 0;
                    grid[py + (y-py)/2][px + (x-px)/2] = 0;
                    [[0,2],[0,-2],[2,0],[-2,0]].forEach(([dx, dy]) => {
                        let nx = x+dx, ny = y+dy;
                        if (nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && grid[ny][nx] === 1) walls.push([nx, ny, x, y]);
                    });
                }
            }
        }

        async function solveMaze() {
            const start = [1, 1];
            const end = [size-2, size-2];
            let queue = [[...start, []]];
            let visited = new Set();
            visited.add(start.join(','));

            while (queue.length > 0) {
                let [x, y, path] = queue.shift();
                if (x === end[0] && y === end[1]) {
                    for (let [px, py] of path) {
                        grid[py][px] = 3;
                    }
                    draw();
                    return;
                }

                [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                    let nx = x+dx, ny = y+dy;
                    if (nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && grid[ny][nx] === 0 && !visited.has(nx+','+ny)) {
                        visited.add(nx+','+ny);
                        queue.push([nx, ny, [...path, [nx, ny]]]);
                    }
                });
            }
        }

        function clearPath() {
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (grid[y][x] === 3) grid[y][x] = 0;
                }
            }
            draw();
        }

        generateMaze();
    </script>
</body>
</html>
